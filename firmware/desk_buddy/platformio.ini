; Desk buddy firmware for the CrowPanel 2.1" rotary display
; (ESP32-S3R8, 16MB flash, 8MB octal PSRAM, 480x480 ST7701 RGB panel, CST826 touch).
[env:crowpanel21]
; Arduino core 3.3.8 (pioarduino/Tasmota build); the plain "espressif32" platform ships the older 2.x core.
platform = https://github.com/tasmota/platform-espressif32/releases/download/2026.05.50/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = elecrow_s3.csv

; -O2 instead of the default -Os: LVGL's software renderer is measurably faster (docs/lessons.md).
build_unflags = -Os
build_flags =
  -O2
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DLV_CONF_INCLUDE_SIMPLE
  -I include

lib_deps =
  lvgl/lvgl@9.6.0
  moononournation/GFX Library for Arduino@1.6.7
  adafruit/Adafruit CST8XX Library@1.1.1
  adafruit/Adafruit BusIO@1.16.2
  xreef/PCF8574 library@2.3.7
  bblanchon/ArduinoJson@7.4.3

; PlatformIO finds the board by itself. If you have several serial devices, set your port:
; upload_port = /dev/cu.usbmodem101    (Windows: COM5, Linux: /dev/ttyACM0)
; monitor_port = /dev/cu.usbmodem101
monitor_speed = 115200
upload_speed = 921600
