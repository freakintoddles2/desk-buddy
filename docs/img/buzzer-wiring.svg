<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Wiring a KY-006 passive buzzer to the CrowPanel's UART1 plug</title>
  <rect width="760" height="440" rx="16" fill="#ffffff"/>

  <!-- Board connector -->
  <text x="40" y="44" font-size="18" font-weight="700" fill="#1d2330">CrowPanel 2.1"</text>
  <text x="40" y="66" font-size="14" fill="#5d6676">UART1 plug (4 pins)</text>
  <rect x="40" y="84" width="200" height="232" rx="12" fill="#1f2530"/>
  <g font-size="15" font-weight="600">
    <rect x="200" y="104" width="28" height="28" rx="5" fill="#c9ced8"/>
    <text x="56" y="124" fill="#c9ced8">5V</text>
    <rect x="200" y="158" width="28" height="28" rx="5" fill="#c9ced8"/>
    <text x="56" y="178" fill="#c9ced8">TX <tspan font-weight="400" font-size="13" fill="#98a2b3">GPIO 43</tspan></text>
    <rect x="200" y="212" width="28" height="28" rx="5" fill="#f5b942"/>
    <text x="56" y="232" fill="#ffffff">RX <tspan font-weight="400" font-size="13" fill="#d8dde6">GPIO 44</tspan></text>
    <rect x="200" y="266" width="28" height="28" rx="5" fill="#ffffff"/>
    <text x="56" y="286" fill="#ffffff">GND</text>
  </g>

  <!-- Buzzer module -->
  <text x="520" y="44" font-size="18" font-weight="700" fill="#1d2330">KY-006 passive buzzer</text>
  <text x="520" y="66" font-size="14" fill="#5d6676">the bare buzzer, no transistor</text>
  <rect x="560" y="84" width="150" height="232" rx="12" fill="#1f6fd1"/>
  <circle cx="635" cy="150" r="44" fill="#14171c"/>
  <circle cx="635" cy="150" r="7" fill="#3a3f48"/>
  <g font-size="15" font-weight="700">
    <rect x="532" y="212" width="28" height="28" rx="5" fill="#f5b942"/>
    <text x="574" y="232" fill="#ffffff">S</text>
    <rect x="532" y="240" width="28" height="28" rx="5" fill="#c9ced8" stroke="#8a93a3"/>
    <text x="574" y="260" fill="#dfe8f6">middle</text>
    <rect x="532" y="268" width="28" height="28" rx="5" fill="#1d2330"/>
    <text x="574" y="288" fill="#ffffff">−</text>
  </g>

  <!-- Wires -->
  <path d="M228 226 C 380 226, 380 226, 532 226" fill="none" stroke="#e0a21f" stroke-width="5" stroke-linecap="round"/>
  <path d="M228 280 C 380 280, 380 282, 532 282" fill="none" stroke="#1d2330" stroke-width="5" stroke-linecap="round"/>
  <text x="380" y="214" font-size="14" font-weight="600" fill="#1d2330" text-anchor="middle">RX → S (signal)</text>
  <text x="380" y="304" font-size="14" font-weight="600" fill="#1d2330" text-anchor="middle">GND → −</text>

  <!-- Not connected -->
  <g font-size="13" fill="#8a93a3">
    <text x="252" y="123">not connected</text>
    <text x="252" y="177">not connected (it's also the LED)</text>
    <text x="560" y="336">middle: not connected</text>
  </g>

  <!-- Notes -->
  <g font-size="13.5" fill="#3b4352">
    <text x="40" y="370">Match the pin names printed on the board and on the module, not wire colors:</text>
    <text x="40" y="390">the plug's real pin order may differ from this drawing.</text>
    <text x="40" y="414">The plug's power pin is 5 V and the signal is 3.3 V, so modules with a transistor and a VCC pin</text>
    <text x="40" y="432">(for example MH-FMD) won't work from this plug.</text>
  </g>
</svg>
