# Builds the firmware and publishes the site (web flasher, guide, sound lab, browser demo) to
# GitHub Pages on every push to main and every version tag.
# One-time setup: repo Settings > Pages > Source: "GitHub Actions".
name: Site and firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe for the version label
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/desk_buddy/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build the firmware
        run: pio run -d firmware/desk_buddy
      - name: Assemble the site
        run: site/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
