<!-- Spin the wheel, removed from display.html on 2026-11-09. Paste each part back where its
     comment says. Play list entry: { id: 'wheel', title: 'Spin the wheel', badge: '', tone: '', sub: WHEEL_SETS[db.wheelSet].name }
     between coin and reflex, and wheel: wheelMode in the Play pick() map. db default: wheelSet: 0. -->

<!-- CSS: after .back-chip:hover -->
<style>
    .wheel-back { cursor: pointer; }
    .wheel-back .wb-pill { fill: rgba(255, 255, 255, .04); stroke: rgba(255, 255, 255, .16); stroke-width: .3; transition: fill .15s, stroke .15s; }
    .wheel-back .wb-ic { fill: none; stroke: #8b93a3; stroke-width: .45; stroke-linecap: round; stroke-linejoin: round; }
    .wheel-back text { fill: #8b93a3; }
    .wheel-back:hover .wb-pill { fill: rgba(255, 255, 255, .08); stroke: rgba(255, 255, 255, .3); }
    .wheel-back:hover text { fill: #f2f4f8; }
    .wheel-back:hover .wb-ic { stroke: #f2f4f8; }
    svg.wheel-full { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>

<script>
// ---------- play: data (top of the "play" section) ----------
    const WHEEL_SETS = [
        { name: 'Yes or no', opts: ['Yes', 'No'] },
        { name: 'Yes, no, maybe', opts: ['Yes', 'No', 'Maybe'] },
        { name: 'Lunch', opts: ['Tacos', 'Pizza', 'Salad', 'Sushi', 'Burgers', 'Thai'] },
        { name: 'Next step', opts: ['Ship it', 'Iterate', 'Ask someone', 'Sleep on it'] },
        { name: 'Pick a number', opts: ['1', '2', '3', '4', '5', '6', '7', '8'] },
    ];
    const WHEEL_COLORS = ['#4f8cff', '#a66bff', '#ff5fd2', '#ff6b6b', '#f5b942', '#3fcf7f', '#2bd4d4', '#ff9a3c'];

// ---------- the mode (before coinMode) ----------
    // Spin the wheel (mock-up F2): the wheel fills the screen. Only the outer neon band
    // spins; the middle shows whatever is under the pointer as it passes, in that option's
    // color, and the ring around the middle takes the same color. Labels follow the rim and
    // turn upright when the wheel stops. Rotate picks the set (while still), press spins.
    let wheelUid = 0;
    const wheelMode = () => {
        const m = { kind: 'wheel', rot: 0, spinning: false, els: null, built: -1, raf: 0, bloom: 0 };
        const set = () => WHEEL_SETS[db.wheelSet];
        const segOf = () => 360 / set().opts.length;
        const pt = (deg, r) => [50 + r * Math.sin(deg * Math.PI / 180), 50 - r * Math.cos(deg * Math.PI / 180)];
        const under = (rot) => Math.floor(((((360 - (rot % 360)) % 360) + 360) % 360) / segOf()) % set().opts.length;
        const color = (i) => WHEEL_COLORS[i % WHEEL_COLORS.length];
        const wedge = (i, r0, r1) => {
            const SEG = segOf();
            const [x0, y0] = pt(i * SEG, r1), [x1, y1] = pt((i + 1) * SEG, r1);
            const [x2, y2] = pt((i + 1) * SEG, r0), [x3, y3] = pt(i * SEG, r0);
            const big = SEG > 180 ? 1 : 0;
            return `M${x0} ${y0} A${r1} ${r1} 0 ${big} 1 ${x1} ${y1} L${x2} ${y2} A${r0} ${r0} 0 ${big} 0 ${x3} ${y3} Z`;
        };
        const build = () => {
            const id = `wh${wheelUid++}`;
            const S = set();
            const SEG = segOf();
            const root = svg('svg', { class: 'wheel-full', viewBox: '0 0 100 100' });
            const defs = svg('defs');
            defs.innerHTML = `<filter id="${id}g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="0.9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="${id}s" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>`;
            const arcs = svg('g');
            defs.appendChild(arcs);
            root.appendChild(defs);
            const g = svg('g');
            S.opts.forEach((_, i) => {
                g.appendChild(svg('path', { d: wedge(i, 33, 49.5), fill: color(i), 'fill-opacity': 0.1 }));
                g.appendChild(svg('path', { d: wedge(i, 46, 49), fill: color(i), filter: `url(#${id}g)` }));
                const [x0, y0] = pt(i * SEG, 33), [x1, y1] = pt(i * SEG, 49.5);
                g.appendChild(svg('line', { x1: x0, y1: y0, x2: x1, y2: y1, stroke: 'rgba(255,255,255,.16)', 'stroke-width': 0.35 }));
            });
            const labels = svg('g');
            g.appendChild(labels);
            root.appendChild(g);
            const halo = svg('circle', { cx: 50, cy: 50, r: 24, opacity: 0.12, filter: `url(#${id}s)` });
            const ring = svg('circle', { cx: 50, cy: 50, r: 32.4, fill: 'none', 'stroke-width': 0.6, filter: `url(#${id}g)` });
            const ptr = svg('path', { d: 'M50 32.6 L47.4 37 L52.6 37 Z', fill: '#fff', filter: `url(#${id}g)` });
            const label = svg('text', { x: 50, y: 50, 'text-anchor': 'middle', 'dominant-baseline': 'middle', 'font-size': 9.5, 'font-weight': 300, filter: `url(#${id}g)` });
            const sub = svg('text', { x: 50, y: 59.5, 'text-anchor': 'middle', fill: '#8b93a3', 'font-size': 3.1, 'font-weight': 600, 'letter-spacing': 0.7 });
            // a quiet Back at the bottom of the centre; swipe and hold still work too
            // Same shape as the device's other chip buttons, quieter: hairline outline, faint fill,
            // a drawn chevron rather than a text character.
            const back = svg('g', { class: 'wheel-back' });
            back.appendChild(svg('rect', { class: 'wb-pill', x: 41.2, y: 70.6, width: 17.6, height: 6.8, rx: 3.4 }));
            back.appendChild(svg('path', { class: 'wb-ic', d: 'M46.6 72.6 L45.1 74 L46.6 75.4' }));
            const bt = svg('text', { x: 51.6, y: 74.15, 'text-anchor': 'middle', 'dominant-baseline': 'middle', 'font-size': 2.9, 'font-weight': 500 });
            bt.textContent = 'Back';
            back.appendChild(bt);
            back.dataset.tap = 'back';
            root.append(halo, ring, ptr, label, sub, back);
            view.replaceChildren(root);
            m.els = { root, g, arcs, labels, halo, ring, label, sub, id };
            m.built = db.wheelSet;
            m.rot = 0;
            g.removeAttribute('transform');
            layLabels();
            idle();
        };
        // Before the first spin (and after switching sets) the middle invites a spin.
        const idle = () => {
            m.els.label.textContent = 'Spin';
            m.els.label.setAttribute('fill', '#f2f4f8');
            m.els.ring.setAttribute('stroke', 'rgba(255,255,255,.22)');
            m.els.halo.setAttribute('fill', '#4f8cff');
        };
        // Rim labels; segments in the bottom half run their arc the other way so they read upright.
        const layLabels = () => {
            const { arcs, labels, id } = m.els;
            const SEG = segOf();
            arcs.replaceChildren();
            labels.replaceChildren();
            set().opts.forEach((o, i) => {
                const mid = ((((i + 0.5) * SEG + m.rot) % 360) + 360) % 360;
                const bottom = mid > 90 && mid < 270;
                const r = bottom ? 41.7 : 38.3;
                const pad = Math.min(4, SEG * 0.12);
                const [ax, ay] = pt(i * SEG + pad, r), [bx, by] = pt((i + 1) * SEG - pad, r);
                const big = SEG - 2 * pad > 180 ? 1 : 0;
                arcs.appendChild(svg('path', { id: `${id}a${i}`, d: bottom ? `M${bx} ${by} A${r} ${r} 0 ${big} 0 ${ax} ${ay}` : `M${ax} ${ay} A${r} ${r} 0 ${big} 1 ${bx} ${by}` }));
                const room = (r * (SEG - 2 * pad) * Math.PI) / 180;
                const size = Math.min(4.4, room / (o.length * 0.78));     // shrink long labels to fit
                const t = svg('text', { fill: color(i), 'font-size': size, 'font-weight': 700, 'letter-spacing': 0.5, filter: `url(#${id}g)` });
                const tp = svg('textPath', { href: `#${id}a${i}`, startOffset: '50%', 'text-anchor': 'middle' });
                tp.textContent = o.toUpperCase();
                t.appendChild(tp);
                labels.appendChild(t);
            });
        };
        const paint = (i) => {
            const c = color(i);
            m.els.label.textContent = set().opts[i];
            m.els.label.setAttribute('fill', c);
            m.els.ring.setAttribute('stroke', c);
            m.els.halo.setAttribute('fill', c);
        };
        const caption = () => { m.els.sub.textContent = m.spinning ? '' : set().name.toUpperCase(); };
        m.render = () => {
            if (!m.els || m.els.root.parentNode !== view || m.built !== db.wheelSet) build();
            caption();
        };
        m.rotate = (dir) => { if (!m.spinning) { db.wheelSet = clamp(db.wheelSet + dir, 0, WHEEL_SETS.length - 1); save(); } };
        m.press = () => {
            if (m.spinning) return;
            m.spinning = true;
            caption();
            m.els.halo.setAttribute('opacity', 0.12);
            const from = m.rot, to = m.rot + 360 * 5 + Math.random() * 360, t0 = performance.now(), dur = 4200;
            const step = (t) => {
                if (!modes.includes(m)) return;
                const k = Math.min(1, (t - t0) / dur);
                m.rot = from + (to - from) * (1 - Math.pow(1 - k, 4));
                m.els.g.setAttribute('transform', `rotate(${m.rot} 50 50)`);
                paint(under(m.rot));
                if (k < 1) { m.raf = requestAnimationFrame(step); return; }
                m.spinning = false;
                layLabels();
                caption();
                let b = 0;    // the halo blooms once
                const bloom = () => { b += 0.05; m.els.halo.setAttribute('opacity', String(0.12 + 0.25 * Math.sin(Math.min(1, b) * Math.PI))); if (b < 1) m.bloom = requestAnimationFrame(bloom); };
                m.bloom = requestAnimationFrame(bloom);
            };
            m.raf = requestAnimationFrame(step);
        };
        m.tap = (name) => { if (name === 'back') pop(); else m.press(); };
        m.close = () => { cancelAnimationFrame(m.raf); cancelAnimationFrame(m.bloom); };
        return m;
    };
</script>
